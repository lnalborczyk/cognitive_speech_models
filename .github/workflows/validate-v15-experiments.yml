name: Validate VTL feedback/feedforward balance

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Build VTL WebAssembly and deploy GitHub Pages']
    types: [completed]

permissions:
  contents: read

jobs:
  vtl-scientific-validation:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Run live VTL tests
        run: |
          python3 scripts/validate_v15_online.py \
            --url https://lnalborczyk.github.io/cognitive_speech_models/ \
            --artifacts artifacts/v15-balance
      - name: Upload measured results (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vtl-feedback-balance-validation
          path: artifacts/v15-balance/
          if-no-files-found: warn
          retention-days: 30
