name: Validate v1.7 model fidelity

on:
  workflow_dispatch:
    inputs:
      exposure_trials:
        description: 'DIVA adaptation trials'
        type: choice
        options: ['3', '5', '8']
        default: '5'
      washout_trials:
        description: 'Unperturbed feedback washout trials'
        type: choice
        options: ['3', '6', '10']
        default: '6'

permissions:
  contents: read

jobs:
  model-validation:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Evaluate real VTL model behavior
        run: |
          python3 scripts/validate_v17_models.py \
            --artifacts artifacts/v17-models \
            --exposure-trials '${{ inputs.exposure_trials || '5' }}' \
            --washout-trials '${{ inputs.washout_trials || '6' }}'
      - name: Upload measured results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vtl-v17-model-fidelity
          path: artifacts/v17-models/
          if-no-files-found: warn
          retention-days: 30
