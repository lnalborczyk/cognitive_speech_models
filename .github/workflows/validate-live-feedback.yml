name: Validate live VTL feedback

on:
  workflow_dispatch:
    inputs:
      include_sustained:
        description: 'Also run held-/a/ auditory feedback diagnostics (slower)'
        required: false
        default: true
        type: boolean
      seeds:
        description: 'Comma-separated random seeds (17 for smoke, 17,23,41 for replication)'
        required: false
        default: '17'
        type: string
  workflow_run:
    workflows: ['Build VTL WebAssembly and deploy GitHub Pages']
    types: [completed]

permissions:
  contents: read

jobs:
  live-feedback:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser testing tools
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Execute live VTL feedback validation
        run: |
          FLAGS=()
          if [[ '${{ inputs.include_sustained }}' == 'true' ]]; then
            FLAGS+=(--include-sustained)
          fi
          python3 scripts/validate_live_feedback.py \
            --url https://lnalborczyk.github.io/cognitive_speech_models/ \
            --seeds '${{ inputs.seeds || '17' }}' \
            --artifacts artifacts/live-validation \
            "${FLAGS[@]}"
      - name: Upload raw F1 trajectories, summary, and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vtl-live-feedback-validation
          path: artifacts/live-validation/
          if-no-files-found: warn
          retention-days: 30
